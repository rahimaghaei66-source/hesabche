    function showReportPreview(pagesHTML, totalPages, formName) {
        const modal = document.getElementById('previewModal');
        const inner = document.getElementById('previewInner');
        const title = document.getElementById('previewTitle');
        const badge = document.getElementById('previewPagesBadge');
        const btnShare = document.getElementById('previewBtnShare');

        title.innerText = 'پیش‌نمایش: ' + formName;
        badge.innerText = toPersian(totalPages) + ' صفحه';

        // پارس صفحات از HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString('<div id="root">' + pagesHTML + '</div>', 'text/html');
        const pageElements = doc.querySelectorAll('#root > div');

        inner.innerHTML = '';

        pageElements.forEach(pageEl => {
            const pageWrapper = document.createElement('div');
            pageWrapper.className = 'preview-page';
            pageWrapper.innerHTML = pageEl.innerHTML;
            inner.appendChild(pageWrapper);
        });

        if (pageElements.length === 0) {
            const pageWrapper = document.createElement('div');
            pageWrapper.className = 'preview-page';
            pageWrapper.innerHTML = pagesHTML;
            inner.appendChild(pageWrapper);
        }

        // نمایش دکمه اشتراک‌گذاری در موبایل
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile && navigator.canShare) {
            btnShare.style.display = 'flex';
        } else {
            btnShare.style.display = 'none';
        }

        modal.classList.add('open');
        document.getElementById('previewContainer').scrollTop = 0;
    }

    function closePreview() {
        document.getElementById('previewModal').classList.remove('open');
    }

    /* ================= ذخیره PDF ================= */
    async function saveReportAsPDF() {
        if (!lastReportHTML) return;

        const btnSave = document.getElementById('previewBtnSave');
        const originalText = btnSave.innerHTML;
        btnSave.disabled = true;
        btnSave.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#fff;"></div> در حال ساخت...';

        const container = document.createElement('div');
        container.style.cssText = 'position:fixed; left:-9999px; top:0; z-index:-1; background:#fff;';
        container.innerHTML = `
            <div style="direction:rtl; font-family:'Vazirmatn', Tahoma, sans-serif; background:#fff; color:#000; width:190mm; box-sizing:border-box;">
                ${lastReportHTML}
            </div>
        `;
        document.body.appendChild(container);

        const reportEl = container.firstElementChild;
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const opt = {
            margin: [8, 8, 8, 8],
            filename: lastReportFilename,
            image: { type: 'jpeg', quality: 0.92 },
            html2canvas: {
                scale: isMobile ? 1.5 : 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                allowTaint: true,
                windowWidth: 800
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'] }
        };

        try {
            if (typeof html2pdf === 'undefined') throw new Error('html2pdf not loaded');
            await html2pdf().set(opt).from(reportEl).save();

            showModal({
                type: 'success',
                title: '✓ PDF ذخیره شد',
                message: 'گزارش شما با موفقیت ذخیره شد.\nمی‌توانید آن را در پوشه Downloads پیدا کنید.',
                confirmText: 'عالی',
                showCancel: false
            });
        } catch (err) {
            console.error('PDF failed:', err);
            showModal({
                type: 'warning',
                title: 'خطا در ساخت PDF',
                message: 'امکان ساخت PDF نبود.\nلطفاً دوباره تلاش کنید یا از گزینه اشتراک‌گذاری استفاده کنید.',
                confirmText: 'باشه',
                showCancel: false
            });
        } finally {
            setTimeout(() => {
                if (container.parentNode) document.body.removeChild(container);
            }, 500);
            btnSave.disabled = false;
            btnSave.innerHTML = originalText;
        }
    }

    /* ================= اشتراک‌گذاری PDF ================= */
    async function shareReportAsPDF() {
        if (!lastReportHTML) return;

        const btnShare = document.getElementById('previewBtnShare');
        const originalText = btnShare.innerHTML;
        btnShare.disabled = true;
        btnShare.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#fff;"></div> در حال آماده‌سازی...';

        const container = document.createElement('div');
        container.style.cssText = 'position:fixed; left:-9999px; top:0; z-index:-1; background:#fff;';
        container.innerHTML = `
            <div style="direction:rtl; font-family:'Vazirmatn', Tahoma, sans-serif; background:#fff; color:#000; width:190mm; box-sizing:border-box;">
                ${lastReportHTML}
            </div>
        `;
        document.body.appendChild(container);

        const reportEl = container.firstElementChild;

        const opt = {
            margin: [8, 8, 8, 8],
            filename: lastReportFilename,
            image: { type: 'jpeg', quality: 0.92 },
            html2canvas: {
                scale: 1.5,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                allowTaint: true,
                windowWidth: 800
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'] }
        };

        try {
            const pdfBlob = await html2pdf().set(opt).from(reportEl).outputPdf('blob');
            const file = new File([pdfBlob], lastReportFilename, { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: 'گزارش تراکنش‌ها',
                    text: 'گزارش شما آماده است'
                });
            } else {
                const url = URL.createObjectURL(pdfBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = lastReportFilename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        } catch (err) {
            console.error('Share failed:', err);
            if (err.name !== 'AbortError') {
                showModal({
                    type: 'warning',
                    title: 'خطا در اشتراک‌گذاری',
                    message: 'امکان اشتراک‌گذاری PDF نبود.\nلطفاً از دکمه ذخیره PDF استفاده کنید.',
                    confirmText: 'باشه',
                    showCancel: false
                });
            }
        } finally {
            setTimeout(() => {
                if (container.parentNode) document.body.removeChild(container);
            }, 500);
            btnShare.disabled = false;
            btnShare.innerHTML = originalText;
        }
    }

    /* ================= کیبورد سفارشی ================= */
    function setKbValue(text) {
        kbValue.innerHTML = '<span>' + text + '</span><span class="blink-cursor"></span>';
    }

    function openKeyboard(input, mode) {
        if (useNativeKeyboard) { input.focus(); return; }
        if (activeInput && activeInput !== input) activeInput.classList.remove('active');
        activeInput = input;
        currentMode = mode;
        input.classList.add('active');

        originalValue = input.value || '';
        originalRaw = input.dataset.raw || '';

        if (mode === 'text') {
            kbNumbers.style.display = 'none';
            kbLetters.style.display = 'grid';
            suggestionsBar.style.display = 'flex';
            kbLabel.innerText = 'نام:';
            setKbValue(input.value || '- - -');
            updateSuggestions(input.value);
        } else if (mode === 'date') {
            kbNumbers.style.display = 'grid';
            kbLetters.style.display = 'none';
            suggestionsBar.style.display = 'flex';
            kbLabel.innerText = 'تاریخ:';
            suggestionsBar.innerHTML = '';
            const todayChip = document.createElement('button');
            todayChip.className = 'suggestion-chip today-chip';
            todayChip.innerText = '📅 امروز';
            todayChip.onclick = () => {
                const today = getTodayPersian();
                activeInput.value = today.display;
                activeInput.dataset.raw = today.raw;
                setKbValue(today.display);
            };
            suggestionsBar.appendChild(todayChip);
            setKbValue(input.value || '----/--/--');
        } else {
            kbNumbers.style.display = 'grid';
            kbLetters.style.display = 'none';
            suggestionsBar.style.display = 'none';
            kbLabel.innerText = 'مبلغ:';
            const raw = input.dataset.raw || '';
            setKbValue(raw ? formatNumber(parseInt(raw)) : '0');
        }

        customKeyboard.classList.add('open');
        keyboardOverlay.classList.add('open');

        setTimeout(() => {
            input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 350);
    }

    function closeKeyboard() {
        if (activeInput) activeInput.classList.remove('active');
        activeInput = null;
        originalValue = '';
        originalRaw = '';
        customKeyboard.classList.remove('open');
        keyboardOverlay.classList.remove('open');
        flushTotals();
        flushSave();
    }

    function kbPress(char) {
        if (!activeInput) return;

        if (currentMode === 'date') {
            let raw = activeInput.dataset.raw || '';
            if (!/^\d$/.test(char)) return;
            if (raw.length < 8) {
                raw += char;
                activeInput.dataset.raw = raw;
                const formatted = formatDate(raw);
                activeInput.value = formatted;
                setKbValue(formatted);
            }
        } else if (currentMode === 'number') {
            let raw = activeInput.dataset.raw || '';
            if (raw === '0') raw = '';
            if (raw.length < 15) {
                raw += char;
                activeInput.dataset.raw = raw;
                const formatted = formatNumber(parseInt(raw));
                activeInput.value = formatted;
                setKbValue(formatted);
            }
        } else {
            let val = activeInput.value || '';
            if (val.length < 40) {
                val += char;
                activeInput.value = val;
                setKbValue(val);
                updateSuggestions(val);
            }
        }
        scheduleTotals();
    }

    function kbBackspace() {
        if (!activeInput) return;

        if (currentMode === 'date') {
            let raw = activeInput.dataset.raw || '';
            raw = raw.slice(0, -1);
            activeInput.dataset.raw = raw;
            const formatted = formatDate(raw);
            activeInput.value = formatted;
            setKbValue(formatted || '----/--/--');
        } else if (currentMode === 'number') {
            let raw = activeInput.dataset.raw || '';
            raw = raw.slice(0, -1);
            activeInput.dataset.raw = raw;
            if (raw) {
                const formatted = formatNumber(parseInt(raw));
                activeInput.value = formatted;
                setKbValue(formatted);
            } else {
                activeInput.value = '';
                setKbValue('0');
            }
        } else {
            let val = activeInput.value || '';
            val = val.slice(0, -1);
            activeInput.value = val;
            setKbValue(val || '- - -');
            updateSuggestions(val);
        }
        scheduleTotals();
    }

    function kbConfirm() {
        if (!activeInput) return;
        if (currentMode === 'text') {
            const row = activeInput.closest('tr');
            const amountInput = row._amountInput;
            activeInput.classList.remove('active');
            flushSave();
            setTimeout(() => openKeyboard(amountInput, 'number'), 150);
        } else {
            closeKeyboard();
        }
    }

    function kbCancel() {
        if (!activeInput) return;
        activeInput.value = originalValue;
        if (currentMode === 'number' || currentMode === 'date') activeInput.dataset.raw = originalRaw;
        scheduleTotals();
        flushSave();
        closeKeyboard();
    }

    function updateSuggestions(currentVal) {
        suggestionsBar.innerHTML = '';
        if (!currentVal || currentVal.length === 0) return;

        const fixed = suggestionsList.filter(word => word.startsWith(currentVal) && word !== currentVal);
        const historical = new Set();
        for (let i = 0; i < forms.length; i++) {
            const formRows = forms[i].rows;
            for (let j = 0; j < formRows.length; j++) {
                const name = (formRows[j].name || '').trim();
                if (name && name.startsWith(currentVal) && name !== currentVal) historical.add(name);
            }
        }

        const allSuggestions = [...new Set([...fixed, ...historical])];
        const fragment = document.createDocumentFragment();
        allSuggestions.forEach(word => {
            const chip = document.createElement('button');
            chip.className = 'suggestion-chip';
            chip.innerText = word;
            chip.onclick = () => applySuggestion(word);
            fragment.appendChild(chip);
        });
        suggestionsBar.appendChild(fragment);
    }

    function applySuggestion(word) {
        if (!activeInput) return;
        const newVal = word + ' ';
        activeInput.value = newVal;
        setKbValue(newVal);
        updateSuggestions(newVal);
    }

    async function handleCheckboxChange(checkbox) {
        const row = checkbox.closest('tr');
        const checkboxes = row._checkboxes;

        if (checkbox.checked) {
            let previousChecked = null;
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i] !== checkbox && checkboxes[i].checked) { previousChecked = checkboxes[i]; break; }
            }
            if (previousChecked) {
                const result = await showModal({
                    type: 'warning', title: 'تغییر روش پرداخت',
                    message: 'شما قبلاً یک روش پرداخت انتخاب کرده‌اید.\nآیا می‌خواهید آن را تغییر دهید؟',
                    confirmText: '✓ بله، تغییر بده', cancelText: '✕ انصراف'
                });
                if (!result) { checkbox.checked = false; return; }
                else previousChecked.checked = false;
            }
        } else {
            const result = await showModal({
                type: 'danger', title: 'حذف تیک',
                message: 'آیا از حذف تیک این مورد مطمئن هستید؟',
                confirmText: '🗑️ بله، حذف کن', cancelText: '✕ انصراف', danger: true
            });
            if (!result) { checkbox.checked = true; return; }
        }
        calculateTotals();
        flushSave();
    }

    function calculateTotals() {
        const rows = tbody.children;
        const rowCount = rows.length;

        let grandTotal = 0;
        let posTotal = 0, chequeTotal = 0, cashTotal = 0, cardTotal = 0;
        let posCnt = 0, chequeCnt = 0, cashCnt = 0, cardCnt = 0;
        let totalCnt = 0;

        for (let i = 0; i < rowCount; i++) {
            const row = rows[i];
            const raw = row._amountInput.dataset.raw;
            if (!raw) continue;
            const amount = +raw;
            if (amount <= 0) continue;

            grandTotal += amount;
            totalCnt++;

            if (row.querySelector('.pos').checked) { posTotal += amount; posCnt++; }
            else if (row.querySelector('.cheque').checked) { chequeTotal += amount; chequeCnt++; }
            else if (row.querySelector('.cash').checked) { cashTotal += amount; cashCnt++; }
            else if (row.querySelector('.card').checked) { cardTotal += amount; cardCnt++; }
        }

        cylinderEls.total.amount.innerText = formatNumber(grandTotal);
        cylinderEls.total.fill.style.width = '100%';
        cylinderEls.total.count.innerText = toPersian(totalCnt);

        const totalVal = grandTotal || 1;
        const posPct = grandTotal > 0 ? Math.round((posTotal / totalVal) * 100) : 0;
        const chequePct = grandTotal > 0 ? Math.round((chequeTotal / totalVal) * 100) : 0;
        const cashPct = grandTotal > 0 ? Math.round((cashTotal / totalVal) * 100) : 0;
        const cardPct = grandTotal > 0 ? Math.round((cardTotal / totalVal) * 100) : 0;

        cylinderEls.pos.percent.innerText = posPct + '%';
        cylinderEls.pos.amount.innerText = formatNumber(posTotal);
        cylinderEls.pos.fill.style.width = posPct + '%';
        cylinderEls.pos.count.innerText = toPersian(posCnt);

        cylinderEls.cheque.percent.innerText = chequePct + '%';
        cylinderEls.cheque.amount.innerText = formatNumber(chequeTotal);
        cylinderEls.cheque.fill.style.width = chequePct + '%';
        cylinderEls.cheque.count.innerText = toPersian(chequeCnt);

        cylinderEls.cash.percent.innerText = cashPct + '%';
        cylinderEls.cash.amount.innerText = formatNumber(cashTotal);
        cylinderEls.cash.fill.style.width = cashPct + '%';
        cylinderEls.cash.count.innerText = toPersian(cashCnt);

        cylinderEls.card.percent.innerText = cardPct + '%';
        cylinderEls.card.amount.innerText = formatNumber(cardTotal);
        cylinderEls.card.fill.style.width = cardPct + '%';
        cylinderEls.card.count.innerText = toPersian(cardCnt);
    }

    function init() {
        loadFromStorage();
        if (forms.length === 0) forms.push(createNewFormData('فرم ۱'));
        for (let i = 0; i < forms.length; i++) {
            if (!forms[i].name) forms[i].name = 'فرم ' + toPersian(i + 1);
        }
        loadForm(currentIndex);

        requestAnimationFrame(() => {
            adjustBottomPadding();
            setTimeout(adjustBottomPadding, 200);
        });

        setupKeyboardHandler();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
            });
        }
    }

    window.addEventListener('resize', adjustBottomPadding);
    window.addEventListener('orientationchange', () => setTimeout(adjustBottomPadding, 300));

    init();
</script>

</body>
</html>
